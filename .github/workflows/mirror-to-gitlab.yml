name: Mirror to GitLab
on:
  push:
    branches: ['**']
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to GitLab
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.wildcode.studio/dulvarn/discord-bot-saas-starter.git
          git push gitlab --all --force
          git push gitlab --tags --force
